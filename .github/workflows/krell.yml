name: Build krell drumlogue synth
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned KORG SDK
        run: |
          git clone https://github.com/korginc/logue-sdk.git sdk
          git -C sdk checkout e84899398dc1a71468a79e293fe68e3ab22e19b6
      - name: Test sequencer gates and memory safety
        run: |
          g++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -I sdk/platform/drumlogue/common -I synth tests/krell_test.cc -o krell-test
          ./krell-test
      - name: Render sequencer pad audio preview
        run: |
          g++ -std=c++14 -Wall -Wextra -Werror -O2 -I sdk/platform/drumlogue/common -I synth tests/preview.cc -o preview
          ./preview > preview.pcm
          python3 -c "import wave; w=wave.open('JerzyKrell-preview.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(48000); w.writeframes(open('preview.pcm','rb').read()); w.close()"
      - name: Compile ARM unit with official SDK build process
        run: |
          cp -r synth sdk/platform/drumlogue/jerzy-krell
          cp sdk/platform/drumlogue/dummy-synth/Makefile sdk/platform/drumlogue/jerzy-krell/Makefile
          image='xiashj/logue-sdk@sha256:e4d85a16c38dc4d34b0e93cabb6378df21729688dbcd88808c84e8d41aa0c9ba'
          docker pull "$image"
          docker run --rm -v "$PWD/sdk/platform:/workspace" -h logue-sdk "$image" /app/cmd_entry build drumlogue/jerzy-krell
      - name: Verify unit header, architecture and entry points
        run: |
          mkdir -p dist
          cp sdk/platform/drumlogue/jerzy-krell/jerzy_krell.drmlgunit dist/
          python3 tests/verify_unit.py dist/jerzy_krell.drmlgunit | tee dist/VALIDATION.txt
          readelf -h dist/jerzy_krell.drmlgunit > dist/ELF.txt
          readelf --dyn-syms -W dist/jerzy_krell.drmlgunit > dist/SYMBOLS.txt
          for symbol in unit_init unit_render unit_header unit_note_on unit_note_off unit_set_param_value unit_set_tempo unit_gate_on unit_gate_off unit_all_note_off; do
            grep -Eq "GLOBAL +DEFAULT +[0-9]+ +$symbol$" dist/SYMBOLS.txt
          done
          cp JerzyKrell-preview.wav dist/
          cp LICENSE dist/LICENSE_DSP.txt
          cp README.md dist/README_PL.md
          cp sdk/LICENSE dist/LICENSE_KORG.txt
          cd dist
          sha256sum jerzy_krell.drmlgunit > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JerzyKrell-drumlogue
          path: dist/
          if-no-files-found: error
          retention-days: 90
